=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg>عاجل<\u002Fspan><\u002Flabel>\n          <label><input type=\"radio\" name=\"prio\" value=\"غير عاجل\"><span class=\"seg-box c\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2\"><\u002Fpath><\u002Fsvg>غير عاجل<\u002Fspan><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field-row\">\n        <div class=\"field\">\n          <label>الحالة<\u002Flabel>\n          <div class=\"sel\" style=\"width:100%\"><select id=\"mStatus\" style=\"width:100%\"><option value=\"جديدة\">جديدة<\u002Foption><option value=\"قيد العمل\">قيد العمل<\u002Foption><option value=\"منجزة\">منجزة<\u002Foption><option value=\"متوقفة\">متوقفة<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"mFollow\">تاريخ المتابعة القادم<\u002Flabel>\n          <input type=\"date\" id=\"mFollow\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"modalCancel\">إلغاء<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"modalSave\" style=\"flex:1.4\">حفظ المهمة<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== المزامنة السحابية (GitHub) ===== -->\n<div class=\"overlay\" id=\"cloudOverlay\" style=\"z-index:95\">\n  <div class=\"modal\" style=\"max-width:520px\" role=\"dialog\" aria-modal=\"true\">\n    <div class=\"modal-head\">\n      <div class=\"mh-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <h2>المزامنة السحابية عبر GitHub<\u002Fh2>\n      <button class=\"modal-close\" id=\"cloudCloseBtn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"cloud-steps\">\n        <strong>كيف تُفعّلها (مرة واحدة لكل جهاز):<\u002Fstrong>\n        <ol>\n          <li>أنشئ مستودعاً <b>خاصاً (Private)<\u002Fb> على GitHub لحفظ بياناتك.<\u002Fli>\n          <li>من إعدادات GitHub ← <span dir=\"ltr\">Developer settings ← Fine-grained tokens<\u002Fspan>، أنشئ رمزاً (Token) صلاحيته على هذا المستودع فقط مع إذن <span dir=\"ltr\">Contents: Read &amp; Write<\u002Fspan>.<\u002Fli>\n          <li>الصق البيانات بالأسفل واضغط «اختبار الاتصال» ثم «تفعيل المزامنة».<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"ghToken\">رمز الوصول (Token)<\u002Flabel>\n        <input type=\"password\" id=\"ghToken\" dir=\"ltr\" autocomplete=\"off\" placeholder=\"github_pat_…\">\n        <span class=\"hint\">يُحفظ في متصفح هذا الجهاز فقط، ولا يُكتب داخل الملف أو نسخة JSON.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"field-row\">\n        <div class=\"field\">\n          <label for=\"ghOwner\">اسم المستخدم / المؤسسة<\u002Flabel>\n          <input type=\"text\" id=\"ghOwner\" dir=\"ltr\" autocomplete=\"off\" placeholder=\"your-username\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"ghRepo\">اسم المستودع<\u002Flabel>\n          <input type=\"text\" id=\"ghRepo\" dir=\"ltr\" autocomplete=\"off\" placeholder=\"my-tasks\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field-row\">\n        <div class=\"field\">\n          <label for=\"ghPath\">مسار ملف البيانات<\u002Flabel>\n          <input type=\"text\" id=\"ghPath\" dir=\"ltr\" autocomplete=\"off\" placeholder=\"data/tasks.json\" value=\"data/tasks.json\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label for=\"ghBranch\">الفرع (Branch)<\u002Flabel>\n          <input type=\"text\" id=\"ghBranch\" dir=\"ltr\" autocomplete=\"off\" placeholder=\"main\" value=\"main\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"cloudTestMsg\" class=\"cloud-test\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\" style=\"flex-wrap:wrap\">\n      <button class=\"btn\" id=\"cloudTestBtn\">اختبار الاتصال<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"cloudSaveBtn\" style=\"flex:1.4\">تفعيل المزامنة<\u002Fbutton>\n      <button class=\"btn\" id=\"cloudDisableBtn\" style=\"flex:1;color:var(--urgent);border-color:var(--urgent-soft);display:none\">إيقاف المزامنة<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== تغيير الرقم السري ===== -->\n<div class=\"overlay\" id=\"pinOverlay\" style=\"z-index:95\">\n  <div class=\"modal\" style=\"max-width:420px\" role=\"dialog\" aria-modal=\"true\">\n    <div class=\"modal-head\">\n      <div class=\"mh-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <h2>تغيير الرقم السري<\u002Fh2>\n      <button class=\"modal-close\" id=\"pinCloseBtn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"field\">\n        <label for=\"pinCur\">الرقم السري الحالي<\u002Flabel>\n        <input type=\"password\" id=\"pinCur\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"• • • •\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"pinNew\">الرقم السري الجديد<\u002Flabel>\n        <input type=\"password\" id=\"pinNew\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"4 خانات على الأقل\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"pinConf\">تأكيد الرقم الجديد<\u002Flabel>\n        <input type=\"password\" id=\"pinConf\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"أعد كتابة الرقم الجديد\">\n      <\u002Fdiv>\n      <p class=\"hint\" style=\"color:var(--muted);line-height:1.6\">يُحفظ الرقم بصيغة مشفّرة ولا يظهر نصّاً في أي مكان.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"pinCancel\">إلغاء<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"pinSave\" style=\"flex:1.4\">حفظ الرقم الجديد<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== نقل المهمة إلى إدارة أخرى ===== -->\n<div class=\"overlay\" id=\"transferOverlay\" style=\"z-index:90\">\n  <div class=\"modal\" style=\"max-width:440px\" role=\"dialog\" aria-modal=\"true\">\n    <div class=\"modal-head\">\n      <div class=\"mh-ico\" style=\"background:var(--move-bg);color:var(--move)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <h2>نقل المهمة إلى إدارة أخرى<\u002Fh2>\n      <button class=\"modal-close\" id=\"transferClose\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"field\">\n        <label>الإدارة الحالية<\u002Flabel>\n        <div class=\"meta\" style=\"margin:0\"><div class=\"v\" id=\"transferCurrent\">—<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"transferDept\">الإدارة الجديدة<\u002Flabel>\n        <div class=\"sel\" style=\"width:100%\"><select id=\"transferDept\" style=\"width:100%\"><\u002Fselect><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"hint\" style=\"background:var(--move-bg);color:var(--text-soft);padding:11px 13px;border-radius:11px;line-height:1.6\">سيُسجَّل وقت النقل تلقائياً في سجل الإجراءات، وتبقى جميع الإجراءات السابقة كما هي دون حذف.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn\" id=\"transferCancel\">إلغاء<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"transferSave\" style=\"flex:1.4\">نقل المهمة الآن<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== مدير القوائم (إدارات / تصنيفات) ===== -->\n<div class=\"overlay\" id=\"manageOverlay\" style=\"z-index:90\">\n  <div class=\"modal\" style=\"max-width:440px\" role=\"dialog\" aria-modal=\"true\">\n    <div class=\"modal-head\">\n      <div class=\"mh-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4h10M11 12h10M11 20h10M3 4h2M3 12h2M3 20h2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <h2 id=\"manageTitle\">إدارة القائمة<\u002Fh2>\n      <button class=\"modal-close\" id=\"manageClose\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"manage-list\" id=\"manageList\"><\u002Fdiv>\n      <div class=\"manage-add-row\">\n        <input type=\"text\" id=\"manageInput\" placeholder=\"أضف عنصراً جديداً…\" autocomplete=\"off\">\n        <button class=\"add-mini\" id=\"manageAdd\" title=\"إضافة\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-foot\">\n      <button class=\"btn btn-primary\" id=\"manageDone\">تم<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<input type=\"file\" id=\"importFile\" accept=\"application/json,.json\" style=\"display:none\">\n<div class=\"toast-wrap\" id=\"toastWrap\"><\u002Fdiv>\n\n<style>\n.more-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text-soft);text-align:start}\n.more-item:hover{background:var(--surface-2);color:var(--text)}\n.more-item svg{width:17px;height:17px;color:var(--muted)}\n<\u002Fstyle>\n\n<script>\n/* ============================================================\n   نظام متابعة المهام والإجراءات — JavaScript (بدون مكتبات)\n   ============================================================ */\n\"use strict\";\n\nconst LS_KEY = \"task_tracker_v1\";\n// بصمة SHA-256 للرقم السري المبدئي (4755) — الرقم نفسه لا يُخزّن نصّاً أبداً\nconst DEFAULT_PIN_HASH = \"0f6004b615adbb8aec4666409a15fc8ddf8e14eea506cf08a8f3d7385c16fe9d\";\nasync function sha256(str){ const b=await crypto.subtle.digest(\"SHA-256\", new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,\"0\")).join(\"\"); }\nconst DEFAULT_DEPTS = [\"إدارة تنمية الموارد المالية\",\"إدارة العلاقات العامة والإعلام\",\"إدارة الحوكمة\",\"إدارة التقنية\",\"الإدارة القانونية\",\"إدارة الموارد البشرية\",\"إدارة الاستراتيجية\",\"إدارة الأوقاف والاستثمار\",\"إدارة المتابعة\",\"إدارة الخدمات\",\"إدارة المشاريع\",\"الإدارة المالية\"];\nconst DEFAULT_CATS = [\"حوكمة\",\"اتفاقيات\",\"إدارة تشغيلية\"];\n\n/* الحالة العامة */\nlet state = {\n  tasks: [],\n  departments: [...DEFAULT_DEPTS],\n  categories: [...DEFAULT_CATS],\n  theme: \"light\",\n  pinHash: null\n};\nlet ui = { search:\"\", fDept:\"\", fCat:\"\", fPrio:\"\", fStatus:\"\", sort:\"follow\", statFilter:\"\" };\nlet openCards = new Set();      // البطاقات المفتوحة\nlet editingId = null;           // مهمة قيد التعديل\nlet fileHandle = null;          // مقبض الملف لحفظ FS Access\n\n/* أدوات مساعدة */\nconst $ = (s,el=document)=>el.querySelector(s);\nconst $$ = (s,el=document)=>[...el.querySelectorAll(s)];\nconst uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc = s=>(s||\"\").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\nconst AR_DAYS=[\"الأحد\",\"الإثنين\",\"الثلاثاء\",\"الأربعاء\",\"الخميس\",\"الجمعة\",\"السبت\"];\nconst AR_MONTHS=[\"يناير\",\"فبراير\",\"مارس\",\"أبريل\",\"مايو\",\"يونيو\",\"يوليو\",\"أغسطس\",\"سبتمبر\",\"أكتوبر\",\"نوفمبر\",\"ديسمبر\"];\nfunction fmtDateTime(ts){\n  const d=new Date(ts); let h=d.getHours(); const m=d.getMinutes();\n  const ap=h<12?\"ص\":\"م\"; h=h%12||12;\n  return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()} — ${h}:${String(m).padStart(2,\"0\")} ${ap}`;\n}\nfunction fmtDate(str){ if(!str) return \"—\"; const d=new Date(str+\"T00:00:00\"); return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }\nfunction todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,\"0\")}-${String(d.getDate()).padStart(2,\"0\")}`; }\nfunction daysUntil(str){ if(!str) return null; const a=new Date(str+\"T00:00:00\"); const b=new Date(todayStr()+\"T00:00:00\"); return Math.round((a-b)/86400000); }\n\n/* حالة المتابعة الذكية */\nfunction followState(task){\n  if(!task.followUp) return {cls:\"\",label:\"\"};\n  if(task.status===\"منجزة\") return {cls:\"\",label:\"\"};\n  const d=daysUntil(task.followUp);\n  if(d===null) return {cls:\"\",label:\"\"};\n  if(d<0) return {cls:\"late\",label:`متأخرة ${Math.abs(d)} يوم`};\n  if(d===0) return {cls:\"late\",label:\"اليوم\"};\n  if(d<=2) return {cls:\"soon\",label:`قريبة (${d} يوم)`};\n  return {cls:\"\",label:\"\"};\n}\n\n/* ============ التخزين ============ */\nlet _suppressBump=false;  // لمنع تحديث الطابع الزمني عند تبني نسخة السحابة\nfunction save(){\n  try{\n    if(!_suppressBump) state.updatedAt=Date.now();\n    localStorage.setItem(LS_KEY, JSON.stringify(state));\n  }catch(e){}\n  if(cloudEnabled() && !_suppressBump) scheduleCloudPush();\n}\nfunction load(){\n  // 1) من localStorage\n  let data=null;\n  try{ const raw=localStorage.getItem(LS_KEY); if(raw) data=JSON.parse(raw); }catch(e){}\n  // 2) أو من البيانات المضمّنة داخل الملف\n  if(!data){\n    try{ const emb=JSON.parse($(\"#saved-data\").textContent); if(emb) data=emb; }catch(e){}\n  }\n  if(data){\n    state.tasks = data.tasks||[];\n    state.departments = data.departments&&data.departments.length?data.departments:[...DEFAULT_DEPTS];\n    state.categories = data.categories&&data.categories.length?data.categories:[...DEFAULT_CATS];\n    state.theme = data.theme||\"light\";\n    state.pinHash = data.pinHash||null;\n    state.updatedAt = data.updatedAt||0;\n  }\n  if(!state.pinHash) state.pinHash = DEFAULT_PIN_HASH; // الرقم المبدئي 4755\n}\n\n/* تطبيق حالة قادمة من السحابة/الاستيراد */\nfunction applyState(d){\n  state.tasks = d.tasks||[];\n  state.departments = d.departments&&d.departments.length?d.departments:[...DEFAULT_DEPTS];\n  state.categories = d.categories&&d.categories.length?d.categories:[...DEFAULT_CATS];\n  if(d.theme) state.theme=d.theme;\n  if(d.pinHash) state.pinHash=d.pinHash;\n  state.updatedAt = d.updatedAt||Date.now();\n}\n\n/* ============ التهيئة ============ */\nfunction init(){\n  load();\n  applyTheme();\n  buildFilterSelects();\n  bindEvents();\n  render();\n  initCloudUI();\n  if(cloudEnabled()) cloudPull();   // سحب آخر نسخة من السحابة عند التحميل\n  lockScreen();   // قفل الصفحة عند كل تحميل\n}\n\nfunction applyTheme(){\n  document.documentElement.setAttribute(\"data-theme\", state.theme);\n  $(\"#themeBtn\").innerHTML = state.theme===\"dark\"\n    ? '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\u002Fsvg>'\n    : '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/><\u002Fsvg>';\n}\n\n/* تعبئة قوائم الفلاتر */\nfunction buildFilterSelects(){\n  const dOpt = '<option value=\"\">كل الإدارات<\u002Foption>'+state.departments.map(d=>`<option value=\"${esc(d)}\">${esc(d)}<\u002Foption>`).join(\"\");\n  $(\"#fDept\").innerHTML=dOpt;\n  const cOpt = '<option value=\"\">كل التصنيفات<\u002Foption>'+state.categories.map(c=>`<option value=\"${esc(c)}\">${esc(c)}<\u002Foption>`).join(\"\");\n  $(\"#fCat\").innerHTML=cOpt;\n}\nfunction buildModalSelects(){\n  $(\"#mDept\").innerHTML = state.departments.map(d=>`<option value=\"${esc(d)}\">${esc(d)}<\u002Foption>`).join(\"\");\n  $(\"#mCat\").innerHTML = state.categories.map(c=>`<option value=\"${esc(c)}\">${esc(c)}<\u002Foption>`).join(\"\");\n}\n\n/* ============ التصفية + الترتيب ============ */\nfunction getVisible(){\n  let list = state.tasks.filter(t=>{\n    if(ui.fDept && t.department!==ui.fDept) return false;\n    if(ui.fCat && t.category!==ui.fCat) return false;\n    if(ui.fPrio && t.priority!==ui.fPrio) return false;\n    if(ui.fStatus && t.status!==ui.fStatus) return false;\n    if(ui.statFilter===\"urgent\" && t.priority!==\"عاجل\") return false;\n    if(ui.statFilter===\"prog\" && t.status!==\"قيد العمل\") return false;\n    if(ui.statFilter===\"done\" && t.status!==\"منجزة\") return false;\n    if(ui.statFilter===\"late\" && followState(t).cls!==\"late\") return false;\n    if(ui.search){\n      const q=ui.search.toLowerCase();\n      const hay=(t.desc+\" \"+t.department+\" \"+t.category+\" \"+(t.actions||[]).map(a=>a.kind===\"transfer\"?(a.from+\" \"+a.to):(a.text||\"\")).join(\" \")).toLowerCase();\n      if(!hay.includes(q)) return false;\n    }\n    return true;\n  });\n  const prioRank=t=>t.priority===\"عاجل\"?0:1;\n  list.sort((a,b)=>{\n    if(a.pinned!==b.pinned) return a.pinned?-1:1;       // المثبّتة أولاً\n    if(ui.sort===\"prio\"){ if(prioRank(a)!==prioRank(b)) return prioRank(a)-prioRank(b); return b.createdAt-a.createdAt; }\n    if(ui.sort===\"new\"){ return b.createdAt-a.createdAt; }\n    // تاريخ المتابعة (الأقرب أولاً، بدون تاريخ في الأخير)\n    const da=a.followUp?new Date(a.followUp):null, db=b.followUp?new Date(b.followUp):null;\n    if(da&&db) return da-db; if(da) return -1; if(db) return 1; return b.createdAt-a.createdAt;\n  });\n  return list;\n}\n\n/* ============ العرض ============ */\nfunction render(){ renderStats(); renderCards(); renderFilterUI(); save(); }\n\nfunction renderStats(){\n  const t=state.tasks;\n  const total=t.length;\n  const urgent=t.filter(x=>x.priority===\"عاجل\").length;\n  const prog=t.filter(x=>x.status===\"قيد العمل\").length;\n  const done=t.filter(x=>x.status===\"منجزة\").length;\n  const late=t.filter(x=>followState(x).cls===\"late\").length;\n  const cards=[\n    {k:\"\", cls:\"s-total\", val:total, lbl:\"إجمالي المهام\", ico:'<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>'},\n    {k:\"urgent\", cls:\"s-urgent\", val:urgent, lbl:\"عاجلة\", ico:'<path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/>'},\n    {k:\"prog\", cls:\"s-prog\", val:prog, lbl:\"قيد العمل\", ico:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>'},\n    {k:\"done\", cls:\"s-done\", val:done, lbl:\"منجزة\", ico:'<path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/><path d=\"M22 4 12 14.01l-3-3\"/>'},\n    {k:\"late\", cls:\"s-late\", val:late, lbl:\"متأخرة في المتابعة\", ico:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v4l2.5 1.5\"/><path d=\"M12 2v2\"/>'},\n  ];\n  $(\"#stats\").innerHTML = cards.map(c=>`\n    <button class=\"stat ${c.cls} ${ui.statFilter===c.k&&c.k?'is-active':''}\" data-stat=\"${c.k}\">\n      <div class=\"stat-top\">\n        <div class=\"stat-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${c.ico}<\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-val\">${c.val}<\u002Fdiv>\n      <div class=\"stat-lbl\">${c.lbl}<\u002Fdiv>\n    <\u002Fbutton>`).join(\"\");\n}\n\nfunction statusBadge(s){\n  const map={\"جديدة\":\"b-new\",\"قيد العمل\":\"b-prog\",\"منجزة\":\"b-done\",\"متوقفة\":\"b-stop\"};\n  const ico={\"جديدة\":'<path d=\"M12 2v4M12 18v4M2 12h4M18 12h4\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>',\n    \"قيد العمل\":'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>',\n    \"منجزة\":'<path d=\"M20 6 9 17l-5-5\"/>',\n    \"متوقفة\":'<rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/>'};\n  return `<span class=\"badge ${map[s]}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${ico[s]}<\u002Fsvg>${esc(s)}<\u002Fspan>`;\n}\nfunction prioBadge(p){\n  if(p===\"عاجل\") return '<span class=\"badge b-urgent\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/><\u002Fsvg>عاجل<\u002Fspan>';\n  return '<span class=\"badge b-calm\">غير عاجل<\u002Fspan>';\n}\n\nfunction renderCards(){\n  const list=getVisible();\n  const wrap=$(\"#cards\");\n  $(\"#resultCount\").textContent = state.tasks.length? `${list.length} من ${state.tasks.length} مهمة` : \"\";\n\n  if(!state.tasks.length){\n    wrap.innerHTML=`<div class=\"empty\">\n      <div class=\"empty-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/><\u002Fsvg><\u002Fdiv>\n      <h3>لا توجد مهام بعد<\u002Fh3><p>ابدأ بتسجيل أول توصية أو طلب، ثم سجّل الإجراءات المتخذة عليها أولاً بأول.<\u002Fp>\n      <button class=\"btn btn-primary\" onclick=\"openModal()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/><\u002Fsvg>إضافة مهمة<\u002Fbutton><\u002Fdiv>`;\n    return;\n  }\n  if(!list.length){\n    wrap.innerHTML=`<div class=\"empty\"><div class=\"empty-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.3-4.3\"/><\u002Fsvg><\u002Fdiv>\n      <h3>لا توجد نتائج مطابقة<\u002Fh3><p>جرّب تعديل كلمات البحث أو مسح الفلاتر الحالية.<\u002Fp><\u002Fdiv>`;\n    return;\n  }\n\n  wrap.innerHTML = list.map(t=>{\n    const fs=followState(t);\n    const open=openCards.has(t.id);\n    const acts=(t.actions||[]).slice().sort((a,b)=>b.at-a.at);\n    const last=acts[0];\n    const actionCount=acts.filter(a=>a.kind!==\"transfer\").length;\n    const currentId=(acts.find(a=>a.kind!==\"transfer\")||{}).id;\n    const pcls = t.priority===\"عاجل\"?\"p-urgent\":\"p-calm\";\n    return `<article class=\"card ${pcls} ${fs.cls==='late'?'overdue':''} ${t.pinned?'pinned':''} ${open?'open':''}\" data-id=\"${t.id}\">\n      <div class=\"card-head\" data-toggle>\n        <div class=\"card-main\">\n          <div class=\"card-toprow\">\n            ${prioBadge(t.priority)}\n            ${statusBadge(t.status)}\n            ${t.followUp?`<span class=\"follow ${fs.cls}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/><\u002Fsvg>${fs.label?esc(fs.label):\"متابعة \"+fmtDate(t.followUp)}<\u002Fspan>`:\"\"}\n          <\u002Fdiv>\n          <div class=\"card-desc\">${esc(t.desc)||\"<span style='color:var(--muted)'>بدون وصف<\u002Fspan>\"}<\u002Fdiv>\n          <div class=\"card-sub\">\n            <span class=\"badge b-dept\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18M5 21V7l8-4v18M19 21V11l-6-4\"/><\u002Fsvg>${esc(t.department)}<\u002Fspan>\n            <span class=\"badge b-cat\">${esc(t.category)}<\u002Fspan>\n            ${last?`<span class=\"dot\"><\u002Fspan><span class=\"last-action\">${last.kind===\"transfer\"?'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12\"/><\u002Fsvg>':'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8v4l3 2\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\u002Fsvg>'}<span>${last.kind===\"transfer\"?\"نُقلت إلى «\"+esc(last.to)+\"»\":esc(last.text)}<\u002Fspan><\u002Fspan>`:`<span class=\"dot\"><\u002Fspan><span style=\"color:var(--muted)\">لا توجد إجراءات بعد<\u002Fspan>`}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-aside\">\n          <button class=\"pin-btn ${t.pinned?'on':''}\" data-pin title=\"${t.pinned?'إلغاء التثبيت':'تثبيت في الأعلى'}\">\n            <svg viewBox=\"0 0 24 24\" fill=\"${t.pinned?'currentColor':'none'}\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 17v5M9 10.8V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6.8a3 3 0 0 0 .9 2.1l1.1 1.1H7l1.1-1.1A3 3 0 0 0 9 10.8z\"/><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"chev\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"/><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-body\"><div class=\"card-body-inner\"><div class=\"body-pad\">\n        <div class=\"meta-grid\">\n          <div class=\"meta\"><div class=\"k\">الإدارة المعنية<\u002Fdiv><div class=\"v\">${esc(t.department)}<\u002Fdiv><\u002Fdiv>\n          <div class=\"meta\"><div class=\"k\">التصنيف<\u002Fdiv><div class=\"v\">${esc(t.category)}<\u002Fdiv><\u002Fdiv>\n          <div class=\"meta\"><div class=\"k\">تاريخ المتابعة القادم<\u002Fdiv><div class=\"v\">${t.followUp?fmtDate(t.followUp):\"غير محدّد\"}<\u002Fdiv><\u002Fdiv>\n          <div class=\"meta\"><div class=\"k\">تاريخ التسجيل<\u002Fdiv><div class=\"v\">${fmtDateTime(t.createdAt)}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"action-add no-print\">\n          <textarea data-act-input placeholder=\"سجّل إجراءً جديداً على هذه المهمة… (يُحفظ تلقائياً بتاريخه ووقته)\"><\u002Ftextarea>\n          <button class=\"btn btn-primary\" data-act-add style=\"align-self:stretch\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/><\u002Fsvg>إضافة إجراء<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"tl-title\">سجل الإجراءات (${actionCount})<\u002Fdiv>\n        ${acts.length? `<div class=\"timeline\">${acts.map(a=> a.kind===\"transfer\"\n          ? `<div class=\"tl-item tl-transfer\" data-aid=\"${a.id}\">\n            <div class=\"tl-card\">\n              <div class=\"tl-meta\">\n                <span class=\"tl-move-pill\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12\"/><\u002Fsvg>نقل إداري<\u002Fspan>\n                <span class=\"tl-time\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\u002Fsvg>${fmtDateTime(a.at)}<\u002Fspan>\n                <span class=\"tl-actions no-print\">\n                  <button class=\"tl-mini danger\" data-act-del title=\"حذف السجل\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg><\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tl-text\">نُقلت من «${esc(a.from)}» إلى «${esc(a.to)}»<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>`\n          : `<div class=\"tl-item ${a.id===currentId?'current':''}\" data-aid=\"${a.id}\">\n            <div class=\"tl-card\">\n              <div class=\"tl-meta\">\n                ${a.id===currentId?'<span class=\"tl-now\">الإجراء الحالي<\u002Fspan>':''}\n                <span class=\"tl-time\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\u002Fsvg>${fmtDateTime(a.at)}${a.edited?' · مُعدّل':''}<\u002Fspan>\n                <span class=\"tl-actions no-print\">\n                  <button class=\"tl-mini\" data-act-edit title=\"تعديل\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/><\u002Fsvg><\u002Fbutton>\n                  <button class=\"tl-mini danger\" data-act-del title=\"حذف\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg><\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tl-text\">${esc(a.text)}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>`).join(\"\")}<\u002Fdiv>`\n        : `<div class=\"tl-empty\">لم تُسجَّل أي إجراءات بعد على هذه المهمة.<\u002Fdiv>`}\n\n        <div class=\"card-foot no-print\">\n          <button class=\"foot-btn\" data-edit-task><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/><\u002Fsvg>تعديل بيانات المهمة<\u002Fbutton>\n          <button class=\"foot-btn move\" data-transfer-task><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3l4 4-4 4M20 7H8M8 21l-4-4 4-4M4 17h12\"/><\u002Fsvg>نقل لإدارة<\u002Fbutton>\n          <button class=\"foot-btn danger\" data-del-task style=\"margin-inline-start:auto\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg>حذف المهمة<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Farticle>`;\n  }).join(\"\");\n}\n\nfunction renderFilterUI(){\n  const active = ui.search||ui.fDept||ui.fCat||ui.fPrio||ui.fStatus||ui.statFilter;\n  $(\"#clearFilters\").style.display = active?\"inline-flex\":\"none\";\n}\n\n/* ============ ربط الأحداث ============ */\nfunction bindEvents(){\n  // الوضع الليلي/النهاري\n  $(\"#themeBtn\").onclick=()=>{ state.theme=state.theme===\"dark\"?\"light\":\"dark\"; applyTheme(); save(); };\n  // مهمة جديدة\n  $(\"#addBtn\").onclick=()=>openModal();\n  // البحث والفلاتر\n  $(\"#search\").addEventListener(\"input\",e=>{ ui.search=e.target.value.trim(); renderCards(); renderFilterUI(); });\n  $(\"#fDept\").onchange=e=>{ ui.fDept=e.target.value; renderCards(); renderFilterUI(); };\n  $(\"#fCat\").onchange=e=>{ ui.fCat=e.target.value; renderCards(); renderFilterUI(); };\n  $(\"#fPrio\").onchange=e=>{ ui.fPrio=e.target.value; renderCards(); renderFilterUI(); };\n  $(\"#fStatus\").onchange=e=>{ ui.fStatus=e.target.value; renderCards(); renderFilterUI(); };\n  $(\"#sort\").onchange=e=>{ ui.sort=e.target.value; renderCards(); };\n  $(\"#clearFilters\").onclick=()=>{\n    ui={search:\"\",fDept:\"\",fCat:\"\",fPrio:\"\",fStatus:\"\",sort:ui.sort,statFilter:\"\"};\n    $(\"#search\").value=\"\";$(\"#fDept\").value=\"\";$(\"#fCat\").value=\"\";$(\"#fPrio\").value=\"\";$(\"#fStatus\").value=\"\";\n    render();\n  };\n  // إحصائيات قابلة للنقر كفلتر\n  $(\"#stats\").addEventListener(\"click\",e=>{\n    const b=e.target.closest(\".stat\"); if(!b) return;\n    const k=b.dataset.stat; if(!k) return;\n    ui.statFilter = ui.statFilter===k?\"\":k;\n    render();\n  });\n\n  // قائمة الأدوات الإضافية\n  $(\"#moreBtn\").onclick=(e)=>{ e.stopPropagation(); toggleMore(); };\n  $(\"#morePop\").addEventListener(\"click\",e=>{\n    const it=e.target.closest(\".more-item\"); if(!it) return;\n    const act=it.dataset.act; closeMore();\n    if(act===\"print\") doPrint();\n    if(act===\"export\") exportJSON();\n    if(act===\"import\") $(\"#importFile\").click();\n    if(act===\"lock\") lockScreen();\n    if(act===\"changePin\") openChangePin();\n    if(act===\"cloud\") openCloud();\n  });\n  document.addEventListener(\"click\",closeMore);\n  $(\"#saveFileBtn\").onclick=saveToFile;\n  $(\"#importFile\").onchange=importJSON;\n\n  // أحداث البطاقات (تفويض)\n  $(\"#cards\").addEventListener(\"click\",cardClick);\n\n  // النافذة\n  $(\"#modalClose\").onclick=closeModal;\n  $(\"#modalCancel\").onclick=closeModal;\n  $(\"#taskOverlay\").addEventListener(\"click\",e=>{ if(e.target.id===\"taskOverlay\") closeModal(); });\n  $(\"#modalSave\").onclick=saveTask;\n  $$('.add-mini[data-manage]').forEach(b=>b.onclick=()=>openManage(b.dataset.manage));\n  $(\"#manageClose\").onclick=closeManage;\n  $(\"#manageDone\").onclick=closeManage;\n  $(\"#manageOverlay\").addEventListener(\"click\",e=>{ if(e.target.id===\"manageOverlay\") closeManage(); });\n  $(\"#manageAdd\").onclick=addListItem;\n  $(\"#manageInput\").addEventListener(\"keydown\",e=>{ if(e.key===\"Enter\"){ e.preventDefault(); addListItem(); } });\n  $(\"#manageList\").addEventListener(\"click\",e=>{ const d=e.target.closest(\"[data-del-item]\"); if(d) deleteListItem(d.dataset.delItem); });\n  // نقل المهمة\n  $(\"#transferClose\").onclick=closeTransfer;\n  $(\"#transferCancel\").onclick=closeTransfer;\n  $(\"#transferOverlay\").addEventListener(\"click\",e=>{ if(e.target.id===\"transferOverlay\") closeTransfer(); });\n  $(\"#transferSave\").onclick=doTransfer;\n  // القفل بالرقم السري\n  $(\"#keypad\").addEventListener(\"click\",e=>{ const k=e.target.closest(\".key\"); if(k) keypadKey(k.dataset.k); });\n  $(\"#pinField\").addEventListener(\"keydown\",e=>{ if(e.key===\"Enter\"){ e.preventDefault(); tryUnlock(); } });\n  $(\"#pinEye\").onclick=togglePinEye;\n  // تغيير الرقم السري\n  $(\"#pinCloseBtn\").onclick=closeChangePin;\n  $(\"#pinCancel\").onclick=closeChangePin;\n  $(\"#pinSave\").onclick=saveNewPin;\n  $(\"#pinOverlay\").addEventListener(\"click\",e=>{ if(e.target.id===\"pinOverlay\") closeChangePin(); });\n  $(\"#pinConf\").addEventListener(\"keydown\",e=>{ if(e.key===\"Enter\"){ e.preventDefault(); saveNewPin(); } });\n  // المزامنة السحابية\n  $(\"#syncBtn\").onclick=()=>{ if(cloudEnabled()) cloudPull(); };\n  $(\"#cloudCloseBtn\").onclick=closeCloud;\n  $(\"#cloudOverlay\").addEventListener(\"click\",e=>{ if(e.target.id===\"cloudOverlay\") closeCloud(); });\n  $(\"#cloudTestBtn\").onclick=cloudTest;\n  $(\"#cloudSaveBtn\").onclick=cloudSaveCfg;\n  $(\"#cloudDisableBtn\").onclick=cloudDisable;\n\n  document.addEventListener(\"keydown\",e=>{ if(e.key===\"Escape\"){ if(document.body.classList.contains(\"locked\")) return; if($(\"#cloudOverlay\").classList.contains(\"show\")) closeCloud(); else if($(\"#pinOverlay\").classList.contains(\"show\")) closeChangePin(); else if($(\"#manageOverlay\").classList.contains(\"show\")) closeManage(); else if($(\"#transferOverlay\").classList.contains(\"show\")) closeTransfer(); else { closeModal(); closeMore(); } } });\n}\n\n/* ===== تفاعل البطاقة ===== */\nfunction cardClick(e){\n  const card=e.target.closest(\".card\"); if(!card) return;\n  const id=card.dataset.id;\n  const task=state.tasks.find(t=>t.id===id); if(!task) return;\n\n  // تثبيت\n  if(e.target.closest(\"[data-pin]\")){ e.stopPropagation(); task.pinned=!task.pinned; render(); return; }\n  // إضافة إجراء\n  if(e.target.closest(\"[data-act-add]\")){\n    const ta=card.querySelector(\"[data-act-input]\"); const txt=ta.value.trim();\n    if(!txt){ ta.focus(); return; }\n    task.actions=task.actions||[]; task.actions.push({id:uid(),text:txt,at:Date.now()});\n    ta.value=\"\"; render(); toast(\"تمت إضافة الإجراء\",\"ok\"); return;\n  }\n  // تعديل إجراء\n  if(e.target.closest(\"[data-act-edit]\")){\n    const item=e.target.closest(\".tl-item\"); startEditAction(item,task); return;\n  }\n  // حذف إجراء\n  if(e.target.closest(\"[data-act-del]\")){\n    const aid=e.target.closest(\".tl-item\").dataset.aid;\n    if(confirm(\"حذف هذا الإجراء؟\")){ task.actions=task.actions.filter(a=>a.id!==aid); render(); toast(\"تم حذف الإجراء\",\"ok\"); }\n    return;\n  }\n  // تعديل المهمة\n  if(e.target.closest(\"[data-edit-task]\")){ openModal(task); return; }\n  // نقل المهمة لإدارة أخرى\n  if(e.target.closest(\"[data-transfer-task]\")){ openTransfer(task); return; }\n  // حذف المهمة\n  if(e.target.closest(\"[data-del-task]\")){\n    if(confirm(\"حذف هذه المهمة وكل إجراءاتها؟ لا يمكن التراجع.\")){ state.tasks=state.tasks.filter(t=>t.id!==id); openCards.delete(id); render(); toast(\"تم حذف المهمة\",\"ok\"); }\n    return;\n  }\n  // فتح/طي\n  if(e.target.closest(\"[data-toggle]\")){\n    if(openCards.has(id)) openCards.delete(id); else openCards.add(id);\n    card.classList.toggle(\"open\");\n    const pin=card.querySelector(\".pin-btn\"); // إبقاء الحالة\n  }\n}\n\n/* تعديل إجراء داخل الخط الزمني */\nfunction startEditAction(item,task){\n  const aid=item.dataset.aid;\n  const a=task.actions.find(x=>x.id===aid); if(!a) return;\n  const body=item.querySelector(\".tl-card\");\n  const textEl=item.querySelector(\".tl-text\");\n  if(item.querySelector(\".tl-edit\")) return;\n  const box=document.createElement(\"div\"); box.className=\"tl-edit\";\n  box.innerHTML=`<textarea>${esc(a.text)}<\u002Ftextarea>\n    <div class=\"tl-edit-btns\"><button class=\"btn btn-primary\" data-save>حفظ<\u002Fbutton><button class=\"btn\" data-cancel>إلغاء<\u002Fbutton><\u002Fdiv>`;\n  textEl.style.display=\"none\"; body.appendChild(box);\n  const ta=box.querySelector(\"textarea\"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);\n  box.querySelector(\"[data-save]\").onclick=()=>{ const v=ta.value.trim(); if(v){ a.text=v; a.edited=true; render(); toast(\"تم تعديل الإجراء\",\"ok\"); } };\n  box.querySelector(\"[data-cancel]\").onclick=()=>{ box.remove(); textEl.style.display=\"\"; };\n}\n\n/* ============ النافذة (إضافة/تعديل مهمة) ============ */\nfunction openModal(task){\n  buildModalSelects();\n  editingId = task? task.id : null;\n  $(\"#modalTitle\").textContent = task? \"تعديل المهمة\":\"مهمة جديدة\";\n  $(\"#fDesc\").value = task? task.desc : \"\";\n  $(\"#mDept\").value = task? task.department : state.departments[0];\n  $(\"#mCat\").value  = task? task.category : state.categories[0];\n  $(\"#mStatus\").value = task? task.status : \"جديدة\";\n  $(\"#mFollow\").value = task? (task.followUp||\"\") : \"\";\n  const pr = task? task.priority : \"غير عاجل\";\n  $$('input[name=prio]').forEach(r=>r.checked = r.value===pr);\n  $(\"#taskOverlay\").classList.add(\"show\");\n  setTimeout(()=>$(\"#fDesc\").focus(),60);\n}\nfunction closeModal(){ $(\"#taskOverlay\").classList.remove(\"show\"); editingId=null; }\n\n/* ============ نقل المهمة إلى إدارة أخرى ============ */\nlet transferId=null;\nfunction logTransfer(task,from,to){ task.actions=task.actions||[]; task.actions.push({id:uid(),kind:\"transfer\",from,to,at:Date.now()}); }\nfunction openTransfer(task){\n  transferId=task.id;\n  $(\"#transferCurrent\").textContent=task.department;\n  const opts=state.departments.filter(d=>d!==task.department);\n  $(\"#transferDept\").innerHTML = opts.length? opts.map(d=>`<option value=\"${esc(d)}\">${esc(d)}<\u002Foption>`).join(\"\") : `<option value=\"\">لا توجد إدارة أخرى<\u002Foption>`;\n  $(\"#transferOverlay\").classList.add(\"show\");\n}\nfunction closeTransfer(){ $(\"#transferOverlay\").classList.remove(\"show\"); transferId=null; }\nfunction doTransfer(){\n  const t=state.tasks.find(x=>x.id===transferId); if(!t){ closeTransfer(); return; }\n  const to=$(\"#transferDept\").value;\n  if(!to || to===t.department){ closeTransfer(); return; }\n  const from=t.department;\n  t.department=to;\n  logTransfer(t,from,to);                 // تسجيل وقت النقل دون حذف الإجراءات\n  openCards.add(t.id);\n  closeTransfer(); render();\n  toast(\"تم نقل المهمة وتسجيل وقت النقل\",\"ok\");\n}\n\n/* ============ القفل بالرقم السري ============ */\nfunction lockScreen(){\n  $(\"#pinField\").value=\"\"; $(\"#lockErr\").textContent=\"\";\n  $(\"#pinField\").type=\"password\";\n  document.body.classList.add(\"locked\");\n  $(\"#lockScreen\").style.display=\"flex\";\n  setTimeout(()=>$(\"#pinField\").focus(),60);\n}\nfunction unlock(){\n  document.body.classList.remove(\"locked\");\n  $(\"#lockScreen\").style.display=\"none\";\n}\nasync function tryUnlock(){\n  const v=$(\"#pinField\").value; if(!v) return;\n  const h=await sha256(v);\n  if(h===state.pinHash){ unlock(); }\n  else { wrongPin(); }\n}\nfunction wrongPin(){\n  const ls=$(\"#lockScreen\"); ls.classList.add(\"shake\");\n  $(\"#lockErr\").textContent=\"رقم سري غير صحيح، حاول مجدداً\";\n  $(\"#pinField\").value=\"\";\n  setTimeout(()=>{ ls.classList.remove(\"shake\"); $(\"#pinField\").focus(); },430);\n}\nfunction keypadKey(k){\n  const f=$(\"#pinField\");\n  if(k===\"enter\"){ tryUnlock(); return; }\n  if(k===\"back\"){ f.value=f.value.slice(0,-1); return; }\n  f.value+=k; $(\"#lockErr\").textContent=\"\";\n}\nfunction togglePinEye(){\n  const f=$(\"#pinField\");\n  f.type = f.type===\"password\"?\"text\":\"password\";\n}\n\n/* ============ تغيير الرقم السري ============ */\nfunction openChangePin(){\n  $(\"#pinCur\").value=\"\"; $(\"#pinNew\").value=\"\"; $(\"#pinConf\").value=\"\";\n  $(\"#pinOverlay\").classList.add(\"show\");\n  setTimeout(()=>$(\"#pinCur\").focus(),60);\n}\nfunction closeChangePin(){ $(\"#pinOverlay\").classList.remove(\"show\"); }\nasync function saveNewPin(){\n  const cur=$(\"#pinCur\").value, nw=$(\"#pinNew\").value.trim(), cf=$(\"#pinConf\").value.trim();\n  if(await sha256(cur)!==state.pinHash){ toast(\"الرقم السري الحالي غير صحيح\",\"err\"); return; }\n  if(nw.length<4){ toast(\"اجعل الرقم 4 خانات على الأقل\",\"err\"); return; }\n  if(nw!==cf){ toast(\"الرقم الجديد وتأكيده غير متطابقين\",\"err\"); return; }\n  state.pinHash=await sha256(nw); save();\n  closeChangePin(); toast(\"تم تغيير الرقم السري بنجاح\",\"ok\");\n}\n\n/* ============ المزامنة السحابية عبر GitHub ============ */\nconst CLOUD_KEY=\"task_tracker_cloud\";\nlet cloud={ token:\"\", owner:\"\", repo:\"\", path:\"data/tasks.json\", branch:\"main\", sha:null };\nlet cloudPushTimer=null;\n\nfunction loadCloud(){ try{ const r=localStorage.getItem(CLOUD_KEY); if(r) cloud=Object.assign(cloud,JSON.parse(r)); }catch(e){} }\nfunction saveCloud(){ try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }catch(e){} }\nfunction cloudEnabled(){ return !!(cloud.token && cloud.owner && cloud.repo && cloud.path); }\n\n// ترميز/فك UTF-8 ↔ Base64 (يدعم العربية)\nfunction b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=\"\"; const ch=0x8000; for(let i=0;i<bytes.length;i+=ch) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch)); return btoa(bin); }\nfunction b64dec(b64){ const bin=atob((b64||\"\").replace(/\\s/g,\"\")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }\n\nfunction ghUrl(){ const p=cloud.path.split(\"/\").map(encodeURIComponent).join(\"/\"); return `https://api.github.com/repos/${encodeURIComponent(cloud.owner)}/${encodeURIComponent(cloud.repo)}/contents/${p}`; }\nfunction ghHeaders(){ return { \"Authorization\":\"Bearer \"+cloud.token, \"Accept\":\"application/vnd.github+json\", \"X-GitHub-Api-Version\":\"2022-11-28\" }; }\n\nfunction scheduleCloudPush(){ clearTimeout(cloudPushTimer); setSync(\"saving\"); cloudPushTimer=setTimeout(cloudPush,1400); }\n\nasync function cloudPush(){\n  if(!cloudEnabled()) return;\n  setSync(\"saving\");\n  const json=JSON.stringify(state,null,2);\n  const mkBody=()=>{ const b={ message:\"تحديث بيانات المهام — \"+new Date().toISOString(), content:b64enc(json), branch:cloud.branch||\"main\" }; if(cloud.sha) b.sha=cloud.sha; return b; };\n  try{\n    let res=await fetch(ghUrl(),{ method:\"PUT\", headers:{...ghHeaders(),\"Content-Type\":\"application/json\"}, body:JSON.stringify(mkBody()) });\n    if(res.status===409 || res.status===422){ await cloudRefreshSha(); res=await fetch(ghUrl(),{ method:\"PUT\", headers:{...ghHeaders(),\"Content-Type\":\"application/json\"}, body:JSON.stringify(mkBody()) }); }\n    if(!res.ok) throw new Error(\"HTTP \"+res.status);\n    const d=await res.json(); cloud.sha=d.content&&d.content.sha; saveCloud(); setSync(\"saved\");\n  }catch(e){ setSync(\"error\"); }\n}\n\nasync function cloudRefreshSha(){\n  try{ const res=await fetch(ghUrl()+\"?ref=\"+(cloud.branch||\"main\"),{headers:ghHeaders()}); if(res.ok){ const d=await res.json(); cloud.sha=d.sha; saveCloud(); } }catch(e){}\n}\n\nasync function cloudPull(){\n  if(!cloudEnabled()) return;\n  setSync(\"saving\");\n  try{\n    const res=await fetch(ghUrl()+\"?ref=\"+(cloud.branch||\"main\"),{headers:ghHeaders()});\n    if(res.status===404){ cloud.sha=null; saveCloud(); await cloudPush(); return; }   // أول مرة: ينشئ الملف\n    if(!res.ok) throw new Error(\"HTTP \"+res.status);\n    const d=await res.json(); cloud.sha=d.sha; saveCloud();\n    const remote=JSON.parse(b64dec(d.content));\n    if((remote.updatedAt||0) > (state.updatedAt||0)){\n      _suppressBump=true; applyState(remote);\n      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}\n      applyTheme(); buildFilterSelects(); openCards.clear(); render(); _suppressBump=false;\n      setSync(\"saved\");\n    } else if((state.updatedAt||0) > (remote.updatedAt||0)){\n      await cloudPush();   // النسخة المحلية أحدث\n    } else { setSync(\"saved\"); }\n  }catch(e){ setSync(\"error\"); }\n}\n\n// مؤشر الحالة في الشريط العلوي\nfunction setSync(st){\n  const pill=$(\"#syncBtn\"); if(!pill) return;\n  pill.style.display = cloudEnabled()? \"inline-flex\":\"none\";\n  pill.classList.remove(\"s-saved\",\"s-saving\",\"s-error\");\n  const ico=$(\"#syncIco\"), txt=$(\"#syncTxt\");\n  if(st===\"saving\"){ pill.classList.add(\"s-saving\"); ico.innerHTML='<span class=\"sync-spin\"><\u002Fspan>'; txt.textContent=\"جارٍ الحفظ…\"; }\n  else if(st===\"saved\"){ pill.classList.add(\"s-saved\"); ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\u002Fsvg>'; txt.textContent=\"تمت المزامنة\"; }\n  else if(st===\"error\"){ pill.classList.add(\"s-error\"); ico.innerHTML='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\u002Fsvg>'; txt.textContent=\"تعذّرت المزامنة\"; }\n}\nfunction initCloudUI(){ loadCloud(); if(cloudEnabled()){ $(\"#syncBtn\").style.display=\"inline-flex\"; setSync(\"saved\"); } }\n\n/* نافذة الإعدادات */\nfunction openCloud(){\n  $(\"#ghToken\").value=cloud.token||\"\"; $(\"#ghOwner\").value=cloud.owner||\"\"; $(\"#ghRepo\").value=cloud.repo||\"\";\n  $(\"#ghPath\").value=cloud.path||\"data/tasks.json\"; $(\"#ghBranch\").value=cloud.branch||\"main\";\n  $(\"#cloudTestMsg\").textContent=\"\"; $(\"#cloudTestMsg\").className=\"cloud-test\";\n  $(\"#cloudDisableBtn\").style.display = cloudEnabled()? \"block\":\"none\";\n  $(\"#cloudOverlay\").classList.add(\"show\");\n}\nfunction closeCloud(){ $(\"#cloudOverlay\").classList.remove(\"show\"); }\nfunction readCloudForm(){\n  return { token:$(\"#ghToken\").value.trim(), owner:$(\"#ghOwner\").value.trim(), repo:$(\"#ghRepo\").value.trim(),\n           path:($(\"#ghPath\").value.trim()||\"data/tasks.json\").replace(/^\\/+/,\"\"), branch:$(\"#ghBranch\").value.trim()||\"main\", sha:null };\n}\nasync function cloudTest(){\n  const c=readCloudForm();\n  const msg=$(\"#cloudTestMsg\");\n  if(!c.token||!c.owner||!c.repo){ msg.className=\"cloud-test err\"; msg.textContent=\"يرجى تعبئة الرمز واسم المستخدم والمستودع.\"; return; }\n  msg.className=\"cloud-test\"; msg.textContent=\"جارٍ الاختبار…\";\n  try{\n    const res=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`,{ headers:{ \"Authorization\":\"Bearer \"+c.token, \"Accept\":\"application/vnd.github+json\" } });\n    if(res.ok){ const d=await res.json(); msg.className=\"cloud-test ok\"; msg.textContent=\"✓ تم الاتصال بنجاح بالمستودع: \"+d.full_name+(d.private?\" (خاص)\":\" (عام)\"); }\n    else if(res.status===401){ msg.className=\"cloud-test err\"; msg.textContent=\"✕ رمز الوصول غير صالح.\"; }\n    else if(res.status===404){ msg.className=\"cloud-test err\"; msg.textContent=\"✕ المستودع غير موجود أو لا يملك الرمز صلاحية عليه.\"; }\n    else throw new Error(\"HTTP \"+res.status);\n  }catch(e){ msg.className=\"cloud-test err\"; msg.textContent=\"✕ تعذّر الاتصال — تحقّق من البيانات والاتصال بالإنترنت.\"; }\n}\nasync function cloudSaveCfg(){\n  const c=readCloudForm();\n  if(!c.token||!c.owner||!c.repo){ toast(\"أكمل بيانات المزامنة\",\"err\"); return; }\n  cloud=Object.assign(cloud,c); cloud.sha=null; saveCloud();\n  $(\"#syncBtn\").style.display=\"inline-flex\";\n  closeCloud(); toast(\"تم تفعيل المزامنة السحابية\",\"ok\");\n  await cloudPull();   // مزامنة فورية\n}\nfunction cloudDisable(){\n  if(!confirm(\"إيقاف المزامنة السحابية على هذا الجهاز؟ تبقى البيانات محفوظة محلياً.\")) return;\n  cloud={ token:\"\", owner:\"\", repo:\"\", path:\"data/tasks.json\", branch:\"main\", sha:null };\n  saveCloud(); $(\"#syncBtn\").style.display=\"none\"; closeCloud(); toast(\"تم إيقاف المزامنة\",\"ok\");\n}\n\nfunction saveTask(){\n  const desc=$(\"#fDesc\").value.trim();\n  if(!desc){ $(\"#fDesc\").focus(); $(\"#fDesc\").style.borderColor=\"var(--urgent)\"; toast(\"يرجى كتابة وصف المهمة\",\"err\"); return; }\n  $(\"#fDesc\").style.borderColor=\"\";\n  const prio=($$('input[name=prio]').find(r=>r.checked)||{}).value||\"غير عاجل\";\n  const data={\n    desc,\n    department:$(\"#mDept\").value,\n    category:$(\"#mCat\").value,\n    priority:prio,\n    status:$(\"#mStatus\").value,\n    followUp:$(\"#mFollow\").value||\"\"\n  };\n  if(editingId){\n    const t=state.tasks.find(x=>x.id===editingId);\n    const oldDept=t.department;\n    Object.assign(t,data);\n    // تسجيل النقل تلقائياً إن تغيّرت الإدارة من نافذة التعديل\n    if(oldDept!==data.department) logTransfer(t,oldDept,data.department);\n    toast(\"تم تحديث المهمة\",\"ok\");\n  }else{\n    const t={ id:uid(), ...data, createdAt:Date.now(), pinned:prio===\"عاجل\"?false:false, actions:[] };\n    state.tasks.unshift(t); openCards.add(t.id);\n    toast(\"تمت إضافة المهمة\",\"ok\");\n  }\n  closeModal(); render();\n}\n\n/* ============ مدير الإدارات / التصنيفات (إضافة + حذف) ============ */\nlet manageType=null;\nfunction openManage(type){\n  manageType=type;\n  $(\"#manageTitle\").textContent = type===\"dept\"?\"إدارة قائمة الإدارات\":\"إدارة قائمة التصنيفات\";\n  $(\"#manageInput\").placeholder = type===\"dept\"?\"أضف إدارة جديدة…\":\"أضف تصنيفاً جديداً…\";\n  renderManageList();\n  $(\"#manageOverlay\").classList.add(\"show\");\n  setTimeout(()=>$(\"#manageInput\").focus(),60);\n}\nfunction closeManage(){ $(\"#manageOverlay\").classList.remove(\"show\"); manageType=null; }\nfunction listArr(){ return manageType===\"dept\"?state.departments:state.categories; }\nfunction usedCount(name){ return state.tasks.filter(t=> manageType===\"dept\"? t.department===name : t.category===name).length; }\nfunction renderManageList(){\n  const arr=listArr();\n  if(!arr.length){ $(\"#manageList\").innerHTML=`<div class=\"manage-empty\">لا توجد عناصر — أضف عنصراً بالأسفل.<\u002Fdiv>`; return; }\n  $(\"#manageList\").innerHTML = arr.map(name=>{\n    const u=usedCount(name);\n    return `<div class=\"manage-row\">\n      <span class=\"nm\">${esc(name)}<\u002Fspan>\n      ${u?`<span class=\"use\">${u} مهمة<\u002Fspan>`:\"\"}\n      <button class=\"manage-del\" data-del-item=\"${esc(name)}\" title=\"حذف\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join(\"\");\n}\nfunction addListItem(){\n  const inp=$(\"#manageInput\"); const val=inp.value.trim(); if(!val) return;\n  const arr=listArr();\n  if(arr.includes(val)){ toast(\"العنصر موجود مسبقاً\",\"err\"); return; }\n  arr.push(val); inp.value=\"\";\n  buildFilterSelects(); buildModalSelects(); renderManageList(); save();\n  toast(\"تمت الإضافة\",\"ok\");\n}\nfunction deleteListItem(name){\n  const u=usedCount(name);\n  const kind = manageType===\"dept\"?\"الإدارة\":\"التصنيف\";\n  if(u>0){ if(!confirm(`${kind} «${name}» مستخدم في ${u} مهمة.\\nسيُحذف من القائمة فقط ويبقى الاسم على تلك المهام. متابعة؟`)) return; }\n  else { if(!confirm(`حذف ${kind} «${name}» من القائمة؟`)) return; }\n  if(manageType===\"dept\") state.departments=state.departments.filter(x=>x!==name);\n  else state.categories=state.categories.filter(x=>x!==name);\n  // إعادة ضبط قيمة الفلتر إن كانت تشير للمحذوف\n  if(manageType===\"dept\" && ui.fDept===name) ui.fDept=\"\";\n  if(manageType===\"cat\" && ui.fCat===name) ui.fCat=\"\";\n  buildFilterSelects(); buildModalSelects(); renderManageList();\n  $(\"#fDept\").value=ui.fDept; $(\"#fCat\").value=ui.fCat;\n  render();\n  toast(\"تم الحذف\",\"ok\");\n}\n\n/* ============ القائمة الإضافية ============ */\nfunction toggleMore(){\n  const p=$(\"#morePop\");\n  if(p.style.display===\"block\"){ closeMore(); return; }\n  const r=$(\"#moreBtn\").getBoundingClientRect();\n  p.style.display=\"block\";\n  p.style.top=(r.bottom+8)+\"px\";\n  p.style.insetInlineEnd=(window.innerWidth-r.right)+\"px\";\n  p.style.insetInlineStart=\"auto\";\n}\nfunction closeMore(){ $(\"#morePop\").style.display=\"none\"; }\n\n/* ============ التصدير / الاستيراد / الطباعة ============ */\nfunction exportJSON(){\n  const blob=new Blob([JSON.stringify(state,null,2)],{type:\"application/json\"});\n  const url=URL.createObjectURL(blob); const a=document.createElement(\"a\");\n  a.href=url; a.download=`نسخة-احتياطية-المهام-${todayStr()}.json`; a.click();\n  URL.revokeObjectURL(url); toast(\"تم تصدير النسخة الاحتياطية\",\"ok\");\n}\nfunction importJSON(e){\n  const file=e.target.files[0]; if(!file) return;\n  const rd=new FileReader();\n  rd.onload=()=>{\n    try{\n      const d=JSON.parse(rd.result);\n      if(!d.tasks) throw 0;\n      if(!confirm(\"سيتم استبدال البيانات الحالية بالملف المستورد. متابعة؟\")) return;\n      state.tasks=d.tasks||[];\n      state.departments=d.departments&&d.departments.length?d.departments:[...DEFAULT_DEPTS];\n      state.categories=d.categories&&d.categories.length?d.categories:[...DEFAULT_CATS];\n      if(d.theme) state.theme=d.theme;\n      applyTheme(); buildFilterSelects(); openCards.clear(); render();\n      toast(\"تم استيراد البيانات بنجاح\",\"ok\");\n    }catch(err){ toast(\"ملف غير صالح\",\"err\"); }\n  };\n  rd.readAsText(file); e.target.value=\"\";\n}\nfunction doPrint(){ $(\"#printDate\").textContent=\"تاريخ التقرير: \"+fmtDateTime(Date.now()); window.print(); }\n\n/* ============ الحفظ داخل ملف الـHTML نفسه (File System Access API) ============ */\nasync function saveToFile(){\n  // تضمين البيانات الحالية داخل وسم saved-data ثم كتابة الملف كاملاً\n  const html=buildFullHtml();\n  if(window.showSaveFilePicker){\n    try{\n      if(!fileHandle){\n        fileHandle=await window.showSaveFilePicker({\n          suggestedName:\"متابعة المهام والإجراءات.html\",\n          types:[{description:\"صفحة HTML\",accept:{\"text/html\":[\".html\"]}}]\n        });\n      }\n      const w=await fileHandle.createWritable();\n      await w.write(html); await w.close();\n      toast(\"تم حفظ البيانات داخل الملف\",\"ok\");\n    }catch(err){ if(err && err.name!==\"AbortError\") toast(\"تعذّر الحفظ في الملف\",\"err\"); }\n  }else{\n    // متصفح لا يدعم الواجهة: تنزيل الملف كاملاً\n    const blob=new Blob([html],{type:\"text/html\"}); const url=URL.createObjectURL(blob);\n    const a=document.createElement(\"a\"); a.href=url; a.download=\"متابعة المهام والإجراءات.html\"; a.click();\n    URL.revokeObjectURL(url);\n    toast(\"متصفحك لا يدعم الحفظ المباشر — تم تنزيل نسخة محدّثة\",\"ok\");\n  }\n}\nfunction buildFullHtml(){\n  const clone=document.documentElement.cloneNode(true);\n  // حقن البيانات\n  const ds=clone.querySelector(\"#saved-data\"); if(ds) ds.textContent=JSON.stringify(state);\n  clone.setAttribute(\"data-theme\",state.theme);\n  // تفريغ المناطق الديناميكية (تُبنى تلقائياً عند الفتح)\n  const c=clone.querySelector(\"#cards\"); if(c) c.innerHTML=\"\";\n  const s=clone.querySelector(\"#stats\"); if(s) s.innerHTML=\"\";\n  const ov=clone.querySelector(\"#taskOverlay\"); if(ov) ov.classList.remove(\"show\");\n  const mp=clone.querySelector(\"#morePop\"); if(mp) mp.style.display=\"none\";\n  const tw=clone.querySelector(\"#toastWrap\"); if(tw) tw.innerHTML=\"\";\n  // إعادة شاشة القفل لوضعها الافتراضي (تظهر عند فتح الملف)\n  const lk=clone.querySelector(\"#lockScreen\"); if(lk){ lk.style.display=\"\"; const pf=lk.querySelector(\"#pinField\"); if(pf) pf.value=\"\"; const le=lk.querySelector(\"#lockErr\"); if(le) le.textContent=\"\"; }\n  const po=clone.querySelector(\"#pinOverlay\"); if(po) po.classList.remove(\"show\");\n  const co=clone.querySelector(\"#cloudOverlay\"); if(co) co.classList.remove(\"show\");\n  const sb=clone.querySelector(\"#syncBtn\"); if(sb) sb.style.display=\"none\";\n  const tr=clone.querySelector(\"#transferOverlay\"); if(tr) tr.classList.remove(\"show\");\n  const mo=clone.querySelector(\"#manageOverlay\"); if(mo) mo.classList.remove(\"show\");\n  return \"<!DOCTYPE html>\\n\"+clone.outerHTML;\n}\n\n/* ============ التنبيهات ============ */\nfunction toast(msg,type=\"ok\"){\n  const ico = type===\"ok\"\n    ? '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\u002Fsvg>'\n    : '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\u002Fsvg>';\n  const el=document.createElement(\"div\"); el.className=`toast ${type}`; el.innerHTML=ico+`<span>${esc(msg)}<\u002Fspan>`;\n  $(\"#toastWrap\").appendChild(el);\n  requestAnimationFrame(()=>el.classList.add(\"show\"));\n  setTimeout(()=>{ el.classList.remove(\"show\"); setTimeout(()=>el.remove(),350); },2600);\n}\n\n/* تشغيل */\ninit();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
