    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

              chunks.push(value);

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than

    const headOpen = template.match(/<head[^>]*>/i);

 --st-new:#8aa3ff;  --st-new-bg:#1f2a4d;\n  --st-prog:#e8b85c; --st-prog-bg:#3a2f17;\n  --st-done:#74d3a1; --st-done-bg:#173326;\n  --st-stop:#9aa4bd; --st-stop-bg:#262d44;\n\n  --warn:#ff7a7d; --warn-bg:#3a1f25;\n  --soon:#e8b85c; --soon-bg:#3a2f17;\n  --move:#a78bfa; --move-bg:#241d3f;\n}\n\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{height:100%}\nbody{\n  font-family:\"Segoe UI\",\"Noto Sans Arabic\",\"Geeza Pro\",Tahoma,system-ui,-apple-system,sans-serif;\n  background:var(--bg);\n  background-image:var(--bg-grad);\n  color:var(--text);\n  line-height:1.6;\n  -webkit-font-smoothing:antialiased;\n  transition:background-color .35s ease,color .35s ease;\n  min-height:100%;\n}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\ninput,select,textarea{font-family:inherit;font-size:inherit}\n::selection{background:var(--accent-soft);color:var(--accent)}\n\n/* ============ الشريط العلوي ============ */\n.topbar{\n  position:sticky;top:0;z-index:40;\n  backdrop-filter:saturate(160%) blur(12px);\n  background:color-mix(in srgb, var(--surface) 82%, transparent);\n  border-bottom:1px solid var(--border);\n}\n.topbar-inner{\n  max-width:1200px;margin:0 auto;padding:14px 26px;\n  display:flex;align-items:center;gap:16px;\n}\n.brand{display:flex;align-items:center;gap:13px;min-width:0}\n.brand-mark{\n  width:42px;height:42px;border-radius:12px;flex:0 0 auto;\n  background:linear-gradient(150deg,var(--navy),var(--accent));\n  display:grid;place-items:center;color:#fff;\n  box-shadow:0 6px 16px rgba(58,91,208,.32);\n}\n[data-theme=\"dark\"] .brand-mark{background:linear-gradient(150deg,#33457f,#5d7cf0)}\n.brand-text h1{font-size:18px;font-weight:800;letter-spacing:-.2px;line-height:1.25}\n.brand-text p{font-size:12.5px;color:var(--muted);font-weight:500}\n.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n\n.btn{\n  display:inline-flex;align-items:center;gap:8px;\n  padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;\n  border:1px solid var(--border);background:var(--surface);color:var(--text-soft);\n  transition:transform .12s ease, background .2s, border-color .2s, box-shadow .2s;\n  white-space:nowrap;\n}\n.btn:hover{background:var(--surface-2);border-color:var(--border-strong);transform:translateY(-1px)}\n.btn:active{transform:translateY(0)}\n.btn svg{width:17px;height:17px;flex:0 0 auto}\n.btn-primary{background:linear-gradient(135deg,var(--navy-2),var(--accent));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(58,91,208,.28)}\n.btn-primary:hover{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff}\n.btn-icon{padding:9px;width:40px;height:40px;justify-content:center}\n.btn-icon svg{width:19px;height:19px}\n.btn-ghost{background:transparent;border-color:transparent}\n.btn-ghost:hover{background:var(--surface-2)}\n\n/* ============ الحاوية ============ */\n.wrap{max-width:1200px;margin:0 auto;padding:26px 26px 90px}\n\n/* ============ الإحصائيات ============ */\n.stats{\n  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px;\n}\n.stat{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);\n  padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;\n  transition:transform .14s ease, box-shadow .2s, border-color .2s;\n}\n.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}\n.stat.is-active{border-color:var(--accent);box-shadow:var(--ring)}\n.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}\n.stat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}\n.stat-ico svg{width:18px;height:18px}\n.stat-val{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}\n.stat-lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}\n.stat.s-total .stat-ico{background:var(--accent-soft);color:var(--accent)}\n.stat.s-urgent .stat-ico{background:var(--urgent-bg);color:var(--urgent)}\n.stat.s-prog  .stat-ico{background:var(--st-prog-bg);color:var(--st-prog)}\n.stat.s-done  .stat-ico{background:var(--st-done-bg);color:var(--st-done)}\n.stat.s-late  .stat-ico{background:var(--warn-bg);color:var(--warn)}\n.stat.s-late .stat-val{color:var(--warn)}\n\n/* ============ شريط الأدوات ============ */\n.toolbar{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);\n  padding:14px;box-shadow:var(--shadow);margin-bottom:22px;\n  display:flex;flex-direction:column;gap:12px;\n}\n.toolbar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.search{position:relative;flex:1 1 240px;min-width:200px}\n.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}\n.search input{\n  width:100%;padding:11px 42px 11px 14px;border-radius:11px;\n  border:1px solid var(--border);background:var(--surface-2);color:var(--text);\n  font-size:14px;transition:border-color .2s, box-shadow .2s, background .2s;\n}\n.search input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}\n.sel{position:relative}\n.sel select{\n  appearance:none;-webkit-appearance:none;\n  padding:11px 36px 11px 14px;border-radius:11px;\n  border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);\n  font-size:13.5px;font-weight:600;cursor:pointer;min-width:128px;\n  transition:border-color .2s, box-shadow .2s;\n}\n.sel select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}\n.sel::after{content:\"\";position:absolute;inset-inline-start:13px;top:50%;width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}\n.toolbar-sep{width:1px;align-self:stretch;background:var(--border);margin:2px 2px}\n.chip-clear{font-size:12.5px;color:var(--accent);font-weight:700;padding:6px 10px;border-radius:8px}\n.chip-clear:hover{background:var(--accent-soft)}\n.result-count{font-size:12.5px;color:var(--muted);font-weight:600;margin-inline-start:auto}\n\n/* ============ بطاقات المهام ============ */\n.cards{display:flex;flex-direction:column;gap:14px}\n.card{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);\n  box-shadow:var(--shadow);overflow:hidden;position:relative;\n  transition:box-shadow .2s, border-color .2s, transform .12s;\n}\n.card:hover{box-shadow:var(--shadow-lg)}\n.card.pinned{border-color:var(--accent)}\n.card::before{content:\"\";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--st-stop)}\n.card.p-urgent::before{background:linear-gradient(var(--urgent),#b62a2e)}\n.card.p-calm::before{background:var(--calm)}\n.card.overdue::before{background:linear-gradient(var(--warn),#a82226)}\n\n.card-head{display:flex;align-items:flex-start;gap:14px;padding:17px 20px 17px 22px;cursor:pointer;user-select:none}\n.card-main{flex:1 1 auto;min-width:0}\n.card-toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}\n.card-desc{font-size:15.5px;font-weight:700;color:var(--text);letter-spacing:-.1px;\n  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.card.open .card-desc{-webkit-line-clamp:unset}\n.card-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}\n.card-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--border-strong)}\n.last-action{display:inline-flex;align-items:center;gap:6px;color:var(--text-soft);font-weight:500;min-width:0}\n.last-action svg{width:13px;height:13px;flex:0 0 auto;color:var(--muted)}\n.last-action span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}\n.card-aside{display:flex;align-items:center;gap:8px;flex:0 0 auto}\n.pin-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.18s}\n.pin-btn:hover{background:var(--surface-2);color:var(--accent)}\n.pin-btn.on{color:var(--accent);background:var(--accent-soft)}\n.pin-btn svg{width:17px;height:17px}\n.chev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.25s}\n.chev svg{width:18px;height:18px;transition:transform .28s ease}\n.card.open .chev svg{transform:rotate(180deg)}\n\n/* الشارات */\n.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.4;white-space:nowrap}\n.badge svg{width:12px;height:12px}\n.b-urgent{background:var(--urgent-bg);color:var(--urgent)}\n.b-calm{background:var(--calm-bg);color:var(--calm)}\n.b-new{background:var(--st-new-bg);color:var(--st-new)}\n.b-prog{background:var(--st-prog-bg);color:var(--st-prog)}\n.b-done{background:var(--st-done-bg);color:var(--st-done)}\n.b-stop{background:var(--st-stop-bg);color:var(--st-stop)}\n.b-dept{background:var(--surface-3);color:var(--text-soft)}\n.b-cat{background:var(--surface-3);color:var(--text-soft)}\n.follow{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--text-soft)}\n.follow svg{width:12px;height:12px}\n.follow.late{background:var(--warn-bg);color:var(--warn)}\n.follow.soon{background:var(--soon-bg);color:var(--soon)}\n\n/* ============ جسم البطاقة (مفتوح) ============ */\n.card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}\n.card.open .card-body{grid-template-rows:1fr}\n.card-body-inner{overflow:hidden}\n.body-pad{padding:4px 22px 22px;border-top:1px solid var(--border);margin-top:2px}\n\n.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 6px}\n.meta{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);p rface);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));padding:2px 8px;border-radius:999px;white-space:nowrap}\n.tl-time{font-size:11.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:5px}\n.tl-time svg{width:12px;height:12px}\n.tl-actions{margin-inline-start:auto;display:flex;gap:4px;opacity:0;transition:.18s}\n.tl-item:hover .tl-actions{opacity:1}\n.tl-mini{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}\n.tl-mini:hover{background:var(--surface);color:var(--text)}\n.tl-mini.danger:hover{color:var(--urgent);background:var(--urgent-bg)}\n.tl-mini svg{width:15px;height:15px}\n.tl-text{font-size:14px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word}\n/* عنصر نقل إداري في الخط الزمني */\n.tl-item.tl-transfer::before{background:var(--move);border-color:var(--move);box-shadow:0 0 0 4px var(--move-bg)}\n.tl-item.tl-transfer .tl-card{background:var(--move-bg);border-color:color-mix(in srgb,var(--move) 32%,var(--border))}\n.tl-move-pill{font-size:10.5px;font-weight:800;color:var(--move);background:var(--surface);border:1px solid color-mix(in srgb,var(--move) 30%,var(--border));padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}\n.tl-move-pill svg{width:12px;height:12px}\n.tl-transfer .tl-text{color:var(--text-soft);font-weight:600}\n.foot-btn.move{color:var(--move)}\n.foot-btn.move:hover{background:var(--move-bg);border-color:color-mix(in srgb,var(--move) 30%,var(--border))}\n.tl-edit textarea{width:100%;min-height:60px;resize:vertical;padding:10px 12px;border-radius:9px;border:1px solid var(--accent);background:var(--surface);color:var(--text);font-size:14px;box-shadow:var(--ring)}\n.tl-edit-btns{display:flex;gap:8px;margin-top:8px}\n.tl-empty{font-size:13px;color:var(--muted);padding:8px 0}\n\n.card-foot{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--border)}\n.foot-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-soft);border:1px solid var(--border);background:var(--surface)}\n.foot-btn:hover{background:var(--surface-2)}\n.foot-btn.danger{color:var(--urgent)}\n.foot-btn.danger:hover{background:var(--urgent-bg);border-color:var(--urgent-soft)}\n.foot-btn svg{width:15px;height:15px}\n\n/* الحالة الفارغة */\n.empty{text-align:center;padding:80px 20px;color:var(--muted)}\n.empty-ico{width:76px;height:76px;border-radius:20px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 18px;color:var(--accent);box-shadow:var(--shadow)}\n.empty-ico svg{width:36px;height:36px}\n.empty h3{font-size:18px;color:var(--text);font-weight:700;margin-bottom:6px}\n.empty p{font-size:14px;max-width:360px;margin:0 auto 20px}\n\n/* ============ النافذة المنبثقة ============ */\n.overlay{position:fixed;inset:0;z-index:80;background:rgba(13,18,38,.5);backdrop-filter:blur(4px);\n  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;\n  opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s}\n.overlay.show{opacity:1;visibility:visible}\n.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:560px;\n  box-shadow:var(--shadow-lg);transform:translateY(14px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1);margin:auto}\n.overlay.show .modal{transform:none}\n.modal-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}\n.modal-head h2{font-size:17px;font-weight:800}\n.modal-head .mh-ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}\n.modal-head .mh-ico svg{width:20px;height:20px}\n.modal-close{margin-inline-start:auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}\n.modal-close:hover{background:var(--surface-2);color:var(--text)}\n.modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:16px}\n.field{display:flex;flex-direction:column;gap:7px}\n.field label{font-size:12.5px;font-weight:700;color:var(--text-soft)}\n.field .hint{font-size:11px;color:var(--muted);font-weight:500}\n.field input[type=text],.field textarea,.field select,.field input[type=date]{\n  padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;width:100%;\n  transition:border-color .2s, box-shadow .2s}\n.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}\n.field textarea{min-height:84px;resize:vertical;line-height:1.6}\n.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.with-add{display:flex;gap:8px}\n.with-add .sel{flex:1}\n.with-add select{width:100%}\n.add-mini{width:44px;flex:0 0 auto;border-radius:11px;border:1px dashed var(--border-strong);color:var(--accent);display:grid;place-items:center;background:var(--surface-2)}\n.add-mini:hover{background:var(--accent-soft);border-color:var(--accent)}\n.add-mini svg{width:18px;height:18px}\n/* اختيار مجزّأ (الأولوية) */\n.seg{display:flex;gap:8px}\n.seg label{flex:1;cursor:pointer}\n.seg input{position:absolute;opacity:0;pointer-events:none}\n.seg .seg-box{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--text-soft);transition:.18s}\n.seg .seg-box svg{width:16px;height:16px}\n.seg input:checked + .seg-box.u{border-color:var(--urgent);background:var(--urgent-bg);color:var(--urgent)}\n.seg input:checked + .seg-box.c{border-color:var(--calm);background:var(--calm-bg);color:var(--calm)}\n.modal-foot{display:flex;gap:10px;padding:18px 24px;border-top:1px solid var(--border)}\n.modal-foot .btn{flex:1;justify-content:center;padding:12px}\n/* مدير القوائم (إدارات/تصنيفات) */\n.manage-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin-bottom:4px}\n.manage-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2)}\n.manage-row .nm{flex:1;font-size:13.5px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.manage-row .use{font-size:11px;color:var(--muted);font-weight:700;background:var(--surface-3);padding:2px 8px;border-radius:999px;white-space:nowrap}\n.manage-del{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;color:var(--muted)}\n.manage-del:hover{background:var(--urgent-bg);color:var(--urgent)}\n.manage-del svg{width:15px;height:15px}\n.manage-empty{font-size:13px;color:var(--muted);text-align:center;padding:18px}\n.manage-add-row{display:flex;gap:8px;margin-top:6px}\n.manage-add-row input{flex:1;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;transition:border-color .2s,box-shadow .2s}\n.manage-add-row input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}\n\n/* ============ التنبيه (Toast) ============ */\n.toast-wrap{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);z-index:100;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}\n[dir=rtl] .toast-wrap{transform:translateX(-50%)}\n.toast{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);\n  transform:translateY(20px);opacity:0;transition:.32s cubic-bezier(.2,.8,.2,1)}\n[data-theme=\"dark\"] .toast{background:var(--surface);border:1px solid var(--border-strong);color:var(--text)}\n.toast.show{transform:none;opacity:1}\n.toast svg{width:18px;height:18px;flex:0 0 auto}\n.toast.ok svg{color:#6ee7a8}\n.toast.err svg{color:#ff8a8d}\n\n/* ============ متجاوب ============ */\n@media(max-width:880px){\n  .stats{grid-template-columns:repeat(2,1fr)}\n  .stat.s-total{grid-column:1 / -1}\n}\n@media(max-width:620px){\n  .topbar-inner{padding:12px 16px;gap:10px}\n  .brand-text p{display:none}\n  .wrap{padding:18px 14px 80px}\n  .stats{grid-template-columns:repeat(2,1fr);gap:10px}\n  .stat.s-total{grid-column:auto}\n  .stat-val{font-size:24px}\n  .field-row{grid-template-columns:1fr}\n  .last-action span{max-width:180px}\n  .hide-sm{display:none}\n  .card-head{padding:15px 16px 15px 18px}\n}\n\n/* ============ شاشة القفل ============ */\nbody.locked{overflow:hidden}\n/* مؤشر المزامنة السحابية */\n.sync-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-soft);transition:.2s}\n.sync-pill:hover{background:var(--surface-2);border-color:var(--border-strong)}\n.sync-ico{width:15px;height:15px;display:grid;place-items:center}\n.sync-ico svg{width:15px;height:15px}\n.sync-pill.s-saved{color:var(--st-done);border-color:color-mix(in srgb,var(--st-done) 30%,var(--border));background:var(--st-done-bg)}\n.sync-pill.s-saving{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,var(--border));background:var(--accent-soft)}\n.sync-pill.s-error{color:var(--urgent);border-color:var(--urgent-soft);background:var(--urgent-bg)}\n.sync-spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n/* إعدادات المزامنة */\n.cloud-steps{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;font-size:12.5px;color:var(--text-soft);line-height:1.7}\n.cloud-steps strong{display:block;margin-bottom:7px;color:var(--text);font-size:13px}\n.cloud-steps ol{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:5px}\n.cloud-steps b{color:var(--accent);font-weight:700}\n.cloud-test{font-size:12.5px;font-weight:600;line-height:1.5;min-height:4px}\n.cloud-test.ok{color:var(--st-done)}\n.cloud-test.err{color:var(--urgent)}\n.field input[dir=ltr]{text-align:left}\n#lockScreen{position:fixed;inset:0;z-index:200;background:var(--bg);background-image:var(--bg-grad);display:flex;align-items:center;justify-content:center;padding:24px}\n.lock-card{width:100%;max-width:340px;text-align:center}\n.lock-mark{width:66px;height:66px;border-radius:19px;margin:0 auto 18px;background:linear-gradient(150deg,var(--navy),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(58,91,208,.35)}\n[data-theme=\"dark\"] .lock-mark{background:linear-gradient(150deg,#33457f,#5d7cf0)}\n.lock-mark svg{width:32px;height:32px}\n.lock-card h2{font-size:19px;font-weight:800;letter-spacing:-.2px}\n.lock-card .lock-sub{font-size:13.5px;color:var(--muted);margin-top:6px;margin-bottom:20px}\n.pin-wrap{position:relative;margin-bottom:10px}\n.pin-input{width:100%;text-align:center;letter-spacing:.45em;font-size:22px;font-weight:800;padding:14px 46px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s}\n.pin-input::placeholder{letter-spacing:normal;font-weight:600;font-size:15px}\n.pin-input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}\n.pin-eye{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);cursor:pointer}\n.pin-eye:hover{background:var(--surface-2);color:var(--text)}\n.pin-eye svg{width:19px;height:19px}\n.lock-err{font-size:12.5px;color:var(--urgent);font-weight:700;height:18px;margin-bottom:8px}\n.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}\n.key{padding:15px 0;border-radius:13px;border:1px solid var(--border);background:var(--surface);font-size:20px;font-weight:700;color:var(--text);transition:transform .1s,background .18s;display:grid;place-items:center}\n.key:hover{background:var(--surface-2)}\n.key:active{transform:scale(.95)}\n.key svg{width:20px;height:20px}\n.key.enter{background:linear-gradient(135deg,var(--navy-2),var(--accent));color:#fff;border-color:transparent}\n.key.enter:hover{filter:brightness(1.05)}\n#lockScreen.shake .lock-card{animation:lshake .42s cubic-bezier(.36,.07,.19,.97)}\n@keyframes lshake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}\n\n/* ============ الطباعة ============ */\n@media print{\n  @page{margin:14mm}\n  body{background:#fff;background-image:none}\n  .topbar,.toolbar,.card-aside,.action-add,.card-foot,.tl-actions,.toast-wrap,.overlay,#lockScreen,#pinOverlay,.no-print,.empty{display:none !important}\n  .wrap{max-width:100%;padding:0}\n  .stats{margin-bottom:18px}\n  .stat{box-shadow:none;border:1px solid #ccc;break-inside:avoid}\n  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}\n  .card-body{grid-template-rows:1fr !important}\n  .card .chev{display:none}\n  .print-head{display:block !important}\n}\n.print-head{display:none;text-align:center;margin-bottom:18px}\n.print-head h2{font-size:20px;font-weight:800}\n.print-head p{font-size:13px;color:#555;margin-top:4px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- بيانات محفوظة داخل الملف (تُملأ عند الحفظ فوق نفس الملف) -->\n<script type=\"application/json\" id=\"saved-data\">null<\u002Fscript>\n\n<!-- ===== شاشة القفل ===== -->\n<div id=\"lockScreen\">\n  <div class=\"lock-card\">\n    <div class=\"lock-mark\"><svg viewBox=\"0 0 24 24\" fill=\"
